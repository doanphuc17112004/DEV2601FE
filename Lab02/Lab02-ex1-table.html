<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table {
            border-collapse: collapse;
            width: 700px;
            margin: 20px auto;
            border: 2px solid black;
            font-family: "Times New Roman", Times, serif;
            font-size: 20px;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
        }
        .img-container img {
            width: 100%;
            display: block;
        }
        .main-title {
            background-color: yellow;
            text-align: center;
            font-size: 40px;
            font-weight: bold;
            padding: 15px;
        }
        .header-row {
            background-color: red;
            color: white;
            text-align: center;
        }
        .col-stt {
            width: 40px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th colspan="2" class="img-container">
                    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0M_LU3qx6YC2qiMCgANPZ9zf_hzqGs3I6xw&s" alt="Món ăn đặc sản">
                </th>
            </tr>
            <tr>
                <th colspan="2" class="main-title">
                    Danh sách món ăn
                </th>
            </tr>
            <tr class="header-row">
                <th>STT</th>
                <th>Tên món ăn</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td class="col-stt">1.</td>
                <td class="col-name">Bánh cuốn Thanh Trì</td>
            </tr>
            <tr>
                <td class="col-stt">2.</td>
                <td class="col-name">Xôi Hà Nội</td>
            </tr>
            <tr>
                <td class="col-stt">3.</td>
                <td class="col-name">Chả cá Lã Vọng</td>
            </tr>
            <tr>
                <td class="col-stt">4.</td>
                <td class="col-name">Cháo Cóc</td>
            </tr>
            <tr>
                <td class="col-stt">5.</td>
                <td class="col-name">Bánh Gai Ninh Giang</td>
            </tr>
            <tr>
                <td class="col-stt">6.</td>
                <td class="col-name">Bún Thang Hà Nội</td>
            </tr>
            <tr>
                <td class="col-stt">7.</td>
                <td class="col-name">Canh Lẳng</td>
            </tr>
            <tr>
                <td class="col-stt">8.</td>
                <td class="col-name">Vịt quay Lạng Sơn</td>
            </tr>
        </tbody>
    </table>
</body>
</html>

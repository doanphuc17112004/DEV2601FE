<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item box</title>
    <link rel="stylesheet" href="../css/Lab04-bth5.css">
</head>
<body>
    <div class="container">
        <div class="product-card">
            <div class="card-image">
                <img src="../images/product-tcb.jpg" alt="Trichodermina Thành Châu">
            </div>
            <div class="card-content">
                <h3 class="product-title">
                    Chế phẩm sinh học Trichodermina Thành Châu
                </h3>
            </div>
            <div class="card-footer">
                <div class="price">
                    <i class="fas fa-dollar-sign"></i>
                    <i>$Liên hệ giá</i>
                </div>
                <div class="views">
                    <span>214</span>
                </div>
                <a href="#" class="btn-buy">
                    Mua hàng
                </a>
            </div>
        </div>
    </div>
</body>
</html>

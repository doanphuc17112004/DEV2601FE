<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            height: 300px;
            background-color: #adff2f;
            margin: 100px auto;
            position: relative; 
        }
        .badge {
            width: 60px;
            height: 60px;
            background-color: red;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            
            position: absolute;
            right: 0;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="badge">NEW</div>
    </div>
</body>
</html>

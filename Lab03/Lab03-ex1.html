<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            text-align: center;
            border: 1px solid;
            width: 500px;
            margin: 10px auto;
            box-sizing: border-box;
        }
        .div-1{
            background-color: red;
        }
        .div-2{
            background-color: green;
        }
        .div-3{
            background-color: blue;
        }
        .div-4{
            background-color: yellow;
        }
        .box:hover{
            transform: scale(1.2);
        }
    </style>
</head>
<body>
    <div class="box div-1">
        <p>div-1</p>
    </div>
    <div class="box div-2">
        <p>div-2</p>
    </div>
    <div class="box div-3">
        <p>div-3</p>
    </div>
    <div class="box div-4">
        <p>div-4</p>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        .card {
            width: 100vw;  
            height: 100vh; 
            position: relative;
            background-image: url('https://vcdn1-dulich.vnecdn.net/2022/06/01/CauVangDaNang-1654082224-7229-1654082320.jpg?w=0&h=0&q=100&dpr=2&fit=crop&s=MeVMb72UZA27ivcyB3s7Kg'); 
            background-size: cover;
            background-position: center;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;  
            justify-content: center; 
            align-items: center;    
            color: white;
            text-align: center;
            font-family: "Times New Roman", Times, serif;
        }

        .overlay h2 {
            font-size: 4rem;
            margin-bottom: 20px;
            letter-spacing: 5px;
            text-transform: uppercase;
        }
        .overlay p {
            font-size: 1.5rem;
            margin-bottom: 40px;
            font-weight: 300;
        }
        .btn-more {
            padding: 15px 40px;
            background-color: transparent;
            border: 2px solid white;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
        }
        .btn-more:hover {
            background-color: white;
            color: black;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="overlay">
            <h2>Du lịch Đà Nẵng</h2>
            <p>Biển xanh - nắng vàng - trải nghiệm tuyệt vời</p>
            <a href="#" class="btn-more">Xem thêm</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body { 
            font-family: "Times New Roman", Times, serif; 
            padding: 50px; 
        }
        .nav-menu {
            list-style: none;
            background-color: #333;
            display: flex;
            width: fit-content;
        }
        .nav-menu > li {
            position: relative;
        }
        .nav-menu > li > a {
            display: block;
            padding: 15px 25px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }
        .nav-menu > li:hover > a {
            background-color: #555;
        }
        .sub-menu {
            list-style: none;
            position: absolute; 
            top: 100%;
            display: none; 
        }
        .sub-menu li a {
            display: block;
            padding: 12px 20px;
            color: black;
            text-decoration: none;
        }
        .nav-menu li:hover .sub-menu {
            display: block;
        }
    </style>
</head>
<body>
    <ul class="nav-menu">
        <li><a href="#">Trang chủ</a></li>       
        <li>
            <a href="#">Sản phẩm</a>
            <ul class="sub-menu">
                <li><a href="#">Laptop</a></li>
                <li><a href="#">Điện thoại</a></li>
                <li><a href="#">Phụ kiện</a></li>
            </ul>
        </li>
        <li><a href="#">Liên hệ</a></li>
    </ul>
</body>
</html>
